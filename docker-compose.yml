services:
  rexec-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./:/app
      # In-container kubeconfig path is predefined (matches kubeconfig_mount_path in app settings)
      - ${REXEC_KUBECONFIG_LOCAL_PATH:-${HOME}/.kube/config}:/home/appuser/.kube/config:ro
    restart: unless-stopped
