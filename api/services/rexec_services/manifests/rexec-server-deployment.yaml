apiVersion: apps/v1
kind: Deployment
metadata:
  name: rexec-server
  labels:
    digest: 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rexec-server
  template:
    metadata:
      labels:
        app: rexec-server
    spec:
      volumes:
        - name: requirements
          configMap:
            name: requirements-placeholder
      containers:
        - name: rexec-server
          image:
          imagePullPolicy: Always
          volumeMounts:
            - name: requirements
              mountPath: /etc/rexec/requirements.txt
              subPath: requirements.txt
          command:
            - sh
            - -c
            - |
              echo "pip install -r /etc/rexec/requirements.txt";
              pip install -r /etc/rexec/requirements.txt;
              echo "git clone https://github.com/sci-ndp/SciDx-rexec-server.git server";
              git clone https://github.com/sci-ndp/SciDx-rexec-server.git server;
              echo "cd server";
              cd server;
              echo "python run_server.py ${broker_addr} --broker_port ${broker_port}";
              python run_server.py ${broker_addr} --broker_port ${broker_port} --debug
      restartPolicy: Always
